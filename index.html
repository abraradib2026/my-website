<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELQUIRE</title>
  <meta name="description" content="ELQUIRE — Editor">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav { backdrop-filter: blur(12px); }

    .logo-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .logo-main {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 40px 80px rgba(0, 0, 0, 0.6));
      transition: filter 0.4s ease;
    }

    /* Glitch layers */
    .glitch-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
    }

    .glitch-red { background-image: url('assets/elquire-logo.png'); filter: hue-rotate(200deg) saturate(2); }
    .glitch-cyan { background-image: url('assets/elquire-logo.png'); filter: hue-rotate(80deg) saturate(2); }

    .glitch-active .glitch-red,
    .glitch-active .glitch-cyan {
      animation: glitch-move 0.6s steps(2) infinite;
    }

    .glitch-active .glitch-red { animation-delay: 0ms; }
    .glitch-active .glitch-cyan { animation-delay: 80ms; }

    @keyframes glitch-move {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 2px); }
      40% { transform: translate(6px, -2px); }
      60% { transform: translate(-3px, 4px); }
      80% { transform: translate(3px, -1px); }
      100% { transform: translate(0, 0); }
    }

    /* Big powerful entrance */
    .logo-main {
      transform: scale(0.3) translateY(40px);
      opacity: 0;
      animation: logo-enter 1.1s cubic-bezier(0.23, 1.0, 0.32, 1) forwards;
      animation-delay: 180ms;
    }

    @keyframes logo-enter {
      0% {
        transform: scale(0.25) translateY(80px);
        opacity: 0;
        filter: blur(12px) brightness(0.6);
      }
      55% {
        transform: scale(1.08) translateY(-8px);
        opacity: 1;
        filter: blur(1px) brightness(1.15);
      }
      70% {
        transform: scale(0.96) translateY(4px);
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
        filter: blur(0) brightness(1);
      }
    }

    /* Light sweep */
    .logo-container::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -150%;
      width: 40%;
      height: 140%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.65) 20%,
        rgba(255,255,255,0.9) 50%,
        rgba(255,255,255,0.65) 80%,
        transparent
      );
      transform: skewX(-20deg);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .logo-sweep .logo-container::after {
      animation: sweep 1.4s cubic-bezier(0.23, 1, 0.32, 1) 1.4s forwards;
    }

    @keyframes sweep {
      0% { left: -150%; opacity: 0; }
      15% { opacity: 0.9; }
      60% { left: 180%; opacity: 0.9; }
      100% { left: 220%; opacity: 0; }
    }

    .pixel-bg {
      background-image: 
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 6px 6px;
    }
  </style>
</head>
<body class="bg-[#0B132B] text-[#FFFFFF] overflow-x-hidden">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-[#0B132B]/90 border-b border-white/10 nav">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <a href="index.html" class="font-semibold tracking-[3px] text-xl">ELQUIRE</a>
      </div>

      <div class="hidden md:flex items-center gap-9 text-sm tracking-widest">
        <a href="about.html" class="nav-link text-white/70 hover:text-white transition-colors">ABOUT</a>
        <a href="portfolio.html" class="nav-link text-white/70 hover:text-white transition-colors">WORK</a>
        <a href="store.html" class="nav-link text-white/70 hover:text-white transition-colors">STORE</a>
      </div>

      <div>
        <a href="store.html" 
           class="hidden md:inline-flex items-center px-5 py-2 text-xs tracking-[2px] rounded border border-white/20 hover:bg-white/5 transition-colors">
          ENTER STORE
        </a>
        <button id="menu-btn" class="md:hidden p-2" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden border-t border-white/10 bg-[#0B132B]">
      <div class="px-6 py-6 flex flex-col gap-4 text-sm tracking-widest">
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="portfolio.html" class="nav-link">WORK</a>
        <a href="store.html" class="nav-link">STORE</a>
      </div>
    </div>
  </nav>

  <!-- HERO: Powerful pixelated ELQUIRE logo animation -->
  <section class="min-h-[100dvh] flex flex-col items-center justify-center px-6 pt-8 pb-16 relative pixel-bg">
    <div class="text-center mb-8">
      <div class="inline-block text-[10px] tracking-[4px] text-[#3A506B] mb-3">EDITOR</div>
    </div>

    <div id="logo-wrapper" class="logo-container max-w-[860px] w-full relative select-none">
      <!-- Main logo -->
      <img 
        id="logo-main"
        src="assets/elquire-logo.png" 
        alt="ELQUIRE"
        class="logo-main w-full"
      >

      <!-- Glitch layers -->
      <div class="glitch-layer glitch-red" style="background-image: url('assets/elquire-logo.png');"></div>
      <div class="glitch-layer glitch-cyan" style="background-image: url('assets/elquire-logo.png');"></div>
    </div>

    <div class="mt-12 text-center">
      <div class="text-xs tracking-[3px] text-white/40">SCROLL TO BEGIN</div>
    </div>
  </section>

  <!-- Placeholder for future scroll content (user will specify) -->
  <div class="max-w-4xl mx-auto px-6 pb-32 text-center text-white/50 text-sm">
    <!-- More sections coming — tell me what you want below -->
  </div>

  <script src="js/script.js"></script>
  <script>
    // Powerful ELQUIRE logo animation
    function animateElquireLogo() {
      const wrapper = document.getElementById('logo-wrapper');
      const mainLogo = document.getElementById('logo-main');

      if (!wrapper || !mainLogo) return;

      // Trigger the entrance (CSS handles most of it)
      // After main entrance, trigger glitch + sweep
      setTimeout(() => {
        wrapper.classList.add('logo-sweep');

        // Glitch burst
        wrapper.classList.add('glitch-active');

        // Stop glitch after powerful burst
        setTimeout(() => {
          wrapper.classList.remove('glitch-active');
        }, 820);
      }, 1350);

      // Subtle final polish - add extra depth after settle
      setTimeout(() => {
        mainLogo.style.filter = 'drop-shadow(0 35px 70px rgba(0, 0, 0, 0.55))';
      }, 2400);
    }

    // Keyboard "power" easter egg - press E to re-trigger the animation
    function initLogoEasterEgg() {
      document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'e') {
          const wrapper = document.getElementById('logo-wrapper');
          if (wrapper) {
            wrapper.classList.remove('logo-sweep', 'glitch-active');
            // restart entrance by toggling animation
            wrapper.style.animation = 'none';
            wrapper.offsetHeight; // force reflow
            wrapper.style.animation = '';
            
            setTimeout(() => {
              wrapper.classList.add('logo-sweep', 'glitch-active');
              setTimeout(() => wrapper.classList.remove('glitch-active'), 820);
            }, 50);
          }
        }
      });
    }

    function initLanding() {
      // Start the big logo animation
      setTimeout(() => {
        animateElquireLogo();
      }, 120);

      initLogoEasterEgg();

      // Mobile menu (reuse from script.js if available)
      const btn = document.getElementById('menu-btn');
      const menu = document.getElementById('mobile-menu');
      if (btn && menu) {
        btn.addEventListener('click', () => menu.classList.toggle('hidden'));
        menu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => menu.classList.add('hidden'));
        });
      }
    }

    window.addEventListener('DOMContentLoaded', initLanding);
  </script>
</body>
</html>

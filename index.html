<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELQUIRE</title>
  <meta name="description" content="ELQUIRE">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav { backdrop-filter: blur(12px); }

    .video-hero {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 60px 120px -20px rgb(0 0 0 / 0.7),
                  0 0 0 1px rgba(255,255,255,0.04);
    }

    .video-hero video {
      width: 100%;
      height: auto;
      display: block;
      background: transparent;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Subtle pixel / scanline overlay for extra pixelated feel */
    .video-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 4px 4px;
      pointer-events: none;
      mix-blend-mode: multiply;
      z-index: 2;
    }

    .replay-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 19, 43, 0.6);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
      pointer-events: none;
    }

    .replay-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay-btn {
      padding: 14px 32px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 13px;
      letter-spacing: 3px;
      border-radius: 9999px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .replay-btn:hover {
      background: rgba(92, 122, 158, 0.3);
      border-color: #5C7A9E;
      transform: translateY(-1px);
    }

    .hero-label {
      letter-spacing: 6px;
      font-size: 11px;
    }
  </style>
</head>
<body class="bg-[#0B132B] text-[#FFFFFF]">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-[#0B132B]/90 border-b border-white/10 nav">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <a href="index.html" class="font-semibold tracking-[4px] text-xl">ELQUIRE</a>
      </div>

      <div class="hidden md:flex items-center gap-9 text-sm tracking-[2px]">
        <a href="about.html" class="nav-link text-white/70 hover:text-white transition-colors">ABOUT</a>
        <a href="portfolio.html" class="nav-link text-white/70 hover:text-white transition-colors">WORK</a>
        <a href="store.html" class="nav-link text-white/70 hover:text-white transition-colors">STORE</a>
      </div>

      <div class="flex items-center gap-3">
        <a href="store.html" 
           class="hidden md:inline-flex items-center px-5 py-2 text-xs tracking-[2px] rounded border border-white/20 hover:bg-white/5 transition-colors">
          STORE
        </a>
        <button id="menu-btn" class="md:hidden p-2" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden border-t border-white/10 bg-[#0B132B]">
      <div class="px-6 py-6 flex flex-col gap-4 text-sm tracking-[2px]">
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="portfolio.html" class="nav-link">WORK</a>
        <a href="store.html" class="nav-link">STORE</a>
      </div>
    </div>
  </nav>

  <!-- Dynamic Animated ELQUIRE Hero -->
  <section class="min-h-[100dvh] flex flex-col items-center justify-center px-6 pt-10 pb-12 relative">
    <div class="text-center mb-6">
      <div class="hero-label text-[#3A506B] mb-1">THE EDITOR</div>
      <div class="text-2xl tracking-[6px] font-light text-white/80">ELQUIRE</div>
    </div>

    <div class="video-hero w-full max-w-[1100px] relative" id="video-container">
      <video 
        id="elquire-video"
        src="assets/elquire-animation.webm"
        class="w-full"
        autoplay 
        muted 
        playsinline
        preload="auto"
      ></video>

      <!-- Replay overlay -->
      <div id="replay-overlay" class="replay-overlay">
        <button id="replay-btn" class="replay-btn tracking-[3px]">REPLAY ANIMATION</button>
      </div>
    </div>

    <div class="mt-8 text-center">
      <p class="text-white/50 text-xs tracking-[2px]">CLICK THE ANIMATION TO RESTART</p>
    </div>
  </section>

  <!-- Future content area (user will specify scroll down sections) -->
  <div class="max-w-4xl mx-auto px-6 pb-24 text-center">
    <div class="text-white/40 text-sm">Scroll for more (tell me what to add here)</div>
  </div>

  <script src="js/script.js"></script>
  <script>
    function initElquireVideo() {
      const video = document.getElementById('elquire-video');
      const container = document.getElementById('video-container');
      const overlay = document.getElementById('replay-overlay');
      const replayBtn = document.getElementById('replay-btn');

      if (!video || !container) return;

      // Autoplay the animation when ready (powerful first experience)
      video.addEventListener('canplay', () => {
        video.play().catch(() => {});
      });

      // Make it interactive with clicks
      function restartAnimation() {
        overlay.classList.remove('visible');
        video.currentTime = 0;
        video.play().catch(() => {});
      }

      // Click anywhere on the video area restarts the animation
      container.addEventListener('click', (e) => {
        // Don't trigger if clicking the replay button itself
        if (e.target.id === 'replay-btn') return;
        restartAnimation();
      });

      // Replay button
      if (replayBtn) {
        replayBtn.addEventListener('click', restartAnimation);
      }

      // Show replay overlay when video ends
      video.addEventListener('ended', () => {
        overlay.classList.add('visible');
      });

      // Optional: subtle interaction - pause on right click or long press hint
      container.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (!video.paused) {
          video.pause();
        } else {
          video.play();
        }
      });

      // Keyboard support: press Space or R to replay
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key.toLowerCase() === 'r') {
          e.preventDefault();
          restartAnimation();
        }
      });

      // Make sure it looks good on load
      video.style.opacity = '1';
    }

    // Mobile menu
    function initMobileMenu() {
      const btn = document.getElementById('menu-btn');
      const menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;

      btn.addEventListener('click', () => menu.classList.toggle('hidden'));
      menu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => menu.classList.add('hidden'));
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initElquireVideo();
      initMobileMenu();
    });
  </script>
</body>
</html>
